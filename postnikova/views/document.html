{% extends "base.html" %}
{% block title %}{{ doc.title }} - DocHub IoT{% endblock %}
{% block content %}
<nav class="breadcrumbs">
    <a href="{{ url_for('docs.index') }}">Главная</a> →
    <span>{{ doc.section }}</span> →
    <span>{{ doc.title }}</span>
</nav>
<article class="document">
    <header><h1>{{ doc.title }}</h1></header>
    {% if doc.toc %}
    <aside class="toc">
        <h2>Содержание</h2>
        {{ doc.toc|safe }}
    </aside>
    {% endif %}
    <div class="content-body">{{ doc.html|safe }}</div>
</article>
{% endblock %}
